<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的留言板💌</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f4f7ff;padding:20px;max-width:600px;margin:0 auto}
        .box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #00000012}
        h2{text-align:center;color:#667eea;margin-bottom:18px}
        .input-area{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        #author{width:120px;padding:10px;border:1px solid #ddd;border-radius:8px;outline:none}
        #content{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;outline:none;min-width:180px}
        #send{padding:10px 16px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer}
        .item{padding:12px;border-bottom:1px solid #eee}
        .name{font-weight:bold;color:#667eea;margin-bottom:4px}
        .text{color:#333}
    </style>
</head>
<body>
    <div class="box">
        <h2>我们的留言板💌</h2>
        <div class="input-area">
            <input type="text" id="author" placeholder="你的名字">
            <input type="text" id="content" placeholder="写下留言...">
            <button id="send">发送</button>
        </div>
        <div id="list"></div>
    </div>

<script>
const READ_URL = "https://cloud.bmobapp.com/57c963628a6e6792/duqushujubiao";
const ADD_URL  = "https://cloud.bmobapp.com/57c963628a6e6792/addMemo";

function loadList(){
    fetch(READ_URL)
    .then(res=>res.json())
    .then(ret=>{
        if(ret.code!==200) {
            alert("读取失败："+JSON.stringify(ret));
            return;
        }
        let html = "";
        ret.data.forEach(item=>{
            html += `
            <div class="item">
                <div class="name">${item.author}</div>
                <div class="text">${item.content}</div>
            </div>
            `
        })
        document.getElementById("list").innerHTML = html;
    })
    .catch(e=>alert("读取网络报错："+e))
}

document.getElementById("send").onclick = function(){
    let author = document.getElementById("author").value.trim();
    let content = document.getElementById("content").value.trim();
    if(!author || !content) return alert("名字和内容不能为空");

    const formData = new URLSearchParams();
    formData.append("author", author);
    formData.append("content", content);

    fetch(ADD_URL,{
        method:"POST",
        body: formData
    })
    .then(res=>res.json())
    .then(ret=>{
        if(ret.code===200){
            document.getElementById("content").value="";
            loadList();
            alert("发送成功✅");
        }else{
            alert("发送失败："+ret.msg)
        }
    })
    .catch(e=>alert("发送请求报错："+e))
}

loadList();
setInterval(loadList,3000)
</script>
</body>
</html>
